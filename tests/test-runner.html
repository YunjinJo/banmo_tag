<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>banmo_tag 확장 프로그램 테스트 러너 (Test Suite)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f1419;
      color: #f7f9f9;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2f3336;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #1d9bf0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .card-num {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 4px;
    }
    .card-label {
      font-size: 0.85rem;
      color: #71767b;
    }
    .passed { color: #00ba7c; }
    .failed { color: #f4212e; }
    .total { color: #1d9bf0; }
    .time { color: #ffd400; }
    
    .btn {
      background: #1d9bf0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #1a8cd8; }

    .test-suite {
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .suite-header {
      background: #202327;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 1rem;
      border-bottom: 1px solid #2f3336;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(47, 51, 54, 0.5);
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.9rem;
    }
    .test-item:last-child {
      border-bottom: none;
    }
    .test-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge-pass {
      background: rgba(0, 186, 124, 0.15);
      color: #00ba7c;
      border: 1px solid #00ba7c;
    }
    .badge-fail {
      background: rgba(244, 33, 46, 0.15);
      color: #f4212e;
      border: 1px solid #f4212e;
    }
    .test-detail {
      font-family: monospace;
      font-size: 0.8rem;
      color: #71767b;
      margin-left: 60px;
      word-break: break-all;
    }
    .test-error {
      color: #f4212e;
      font-weight: 600;
    }
    /* Hidden sandbox area for DOM test cases */
    #sandbox {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span>⚡</span> banmo_tag v1.9.2 자동화 테스트 러너</h1>
      <button id="run-btn" class="btn" onclick="runAllTests()">테스트 다시 실행</button>
    </header>

    <div class="summary-cards">
      <div class="card">
        <div class="card-label">전체 테스트</div>
        <div id="stat-total" class="card-num total">0</div>
      </div>
      <div class="card">
        <div class="card-label">통과 (Pass)</div>
        <div id="stat-passed" class="card-num passed">0</div>
      </div>
      <div class="card">
        <div class="card-label">실패 (Fail)</div>
        <div id="stat-failed" class="card-num failed">0</div>
      </div>
      <div class="card">
        <div class="card-label">소요 시간</div>
        <div id="stat-time" class="card-num time">0ms</div>
      </div>
    </div>

    <div id="results"></div>
  </div>

  <!-- 테스트용 가상 DOM 샌드박스 -->
  <div id="sandbox"></div>

  <script src="../extension/shared/base.js"></script>
  <script src="../extension/shared/list-names.js"></script>
  <script src="../extension/shared/list-data.js"></script>
  <script src="../extension/shared/list-page.js"></script>
  <script src="../extension/shared/badges.js"></script>
  <script src="../extension/shared/backup.js"></script>
  <script src="../extension/shared/health.js"></script>
  <script src="../extension/shared/ui.js"></script>
  <!-- 1) 테스트 도구(describe · it · assert…)와 실행기 -->
  <script>
    // =========================================================================
    // 초경량 테스트 프레임워크 (Lightweight Test Framework)
    // =========================================================================

    const testSuites = [];
    let currentSuite = null;

    function describe(suiteName, fn) {
      currentSuite = { name: suiteName, tests: [] };
      testSuites.push(currentSuite);
      fn();
    }

    function it(testName, fn) {
      currentSuite.tests.push({ name: testName, fn });
    }

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message || 'Assertion failed');
      }
    }

    function assertEqual(actual, expected, message) {
      if (actual !== expected) {
        throw new Error((message ? message + ': ' : '') + `Expected [${expected}] but got [${actual}]`);
      }
    }

    function assertDeepEqual(actual, expected, message) {
      const actualJson = JSON.stringify(actual);
      const expectedJson = JSON.stringify(expected);
      if (actualJson !== expectedJson) {
        throw new Error((message ? message + ': ' : '') + `Expected ${expectedJson} but got ${actualJson}`);
      }
    }

    // =========================================================================
    // 테스트 실행기 엔진
    // =========================================================================

    function runAllTests() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
      
      let totalCount = 0;
      let passCount = 0;
      let failCount = 0;

      const startTime = performance.now();

      testSuites.forEach(suite => {
        const suiteEl = document.createElement('div');
        suiteEl.className = 'test-suite';

        const headerEl = document.createElement('div');
        headerEl.className = 'suite-header';
        headerEl.textContent = suite.name;
        suiteEl.appendChild(headerEl);

        let suitePass = 0;
        let suiteFail = 0;

        suite.tests.forEach(test => {
          totalCount++;
          const testEl = document.createElement('div');
          testEl.className = 'test-item';

          const titleRow = document.createElement('div');
          titleRow.className = 'test-title-row';

          const badge = document.createElement('span');
          badge.className = 'badge';

          const title = document.createElement('span');
          title.textContent = test.name;

          titleRow.appendChild(badge);
          titleRow.appendChild(title);
          testEl.appendChild(titleRow);

          let capturedError = null;
          try {
            test.fn();
            passCount++;
            suitePass++;
            badge.className += ' badge-pass';
            badge.textContent = 'PASS';
          } catch (err) {
            failCount++;
            suiteFail++;
            badge.className += ' badge-fail';
            badge.textContent = 'FAIL';
            capturedError = err.message;

            const errDetail = document.createElement('div');
            errDetail.className = 'test-detail test-error';
            errDetail.textContent = '❌ ' + err.message;
            testEl.appendChild(errDetail);
          }
          test._passed = (badge.textContent === 'PASS');
          test._error = test._passed ? null : capturedError;

          suiteEl.appendChild(testEl);
        });

        resultsDiv.appendChild(suiteEl);
      });

      const endTime = performance.now();
      const elapsed = Math.round(endTime - startTime);

      document.getElementById('stat-total').textContent = totalCount;
      document.getElementById('stat-passed').textContent = passCount;
      document.getElementById('stat-failed').textContent = failCount;
      document.getElementById('stat-time').textContent = elapsed + 'ms';

      // CLI 자동화 러너를 위한 정형화된 JSON 데이터 출력
      const report = {
        total: totalCount,
        passed: passCount,
        failed: failCount,
        duration: elapsed + 'ms',
        suites: testSuites.map(suite => ({
          name: suite.name,
          tests: suite.tests.map(t => ({
            name: t.name,
            passed: t._passed,
            error: t._error || null
          }))
        }))
      };

      let jsonEl = document.getElementById('test-results-data');
      if (!jsonEl) {
        jsonEl = document.createElement('script');
        jsonEl.id = 'test-results-data';
        jsonEl.type = 'application/json';
        document.body.appendChild(jsonEl);
      }
      jsonEl.textContent = JSON.stringify(report);
    }

    // 페이지 로드 시 자동 실행
    window.addEventListener('DOMContentLoaded', () => {
      runAllTests();
    });
  </script>

  <!-- 2) 테스트: extension/shared/ 의 파일마다 하나씩 (tests/unit/README.md). 새 파일을 만들면 여기에 추가 -->
  <script src="unit/base.test.js"></script>
  <script src="unit/list-names.test.js"></script>
  <script src="unit/list-data.test.js"></script>
  <script src="unit/list-page.test.js"></script>
  <script src="unit/badges.test.js"></script>
  <script src="unit/backup.test.js"></script>
  <script src="unit/health.test.js"></script>
  <script src="unit/ui.test.js"></script>
  <script src="unit/symbols.test.js"></script>
</body>
</html>
