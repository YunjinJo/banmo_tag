<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>banmo_tag 확장 프로그램 테스트 러너 (Test Suite)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f1419;
      color: #f7f9f9;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2f3336;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      color: #1d9bf0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .summary-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }
    .card {
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }
    .card-num {
      font-size: 1.8rem;
      font-weight: 800;
      margin-top: 4px;
    }
    .card-label {
      font-size: 0.85rem;
      color: #71767b;
    }
    .passed { color: #00ba7c; }
    .failed { color: #f4212e; }
    .total { color: #1d9bf0; }
    .time { color: #ffd400; }
    
    .btn {
      background: #1d9bf0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #1a8cd8; }

    .test-suite {
      background: #16181c;
      border: 1px solid #2f3336;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .suite-header {
      background: #202327;
      padding: 12px 16px;
      font-weight: 700;
      font-size: 1rem;
      border-bottom: 1px solid #2f3336;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .test-item {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(47, 51, 54, 0.5);
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.9rem;
    }
    .test-item:last-child {
      border-bottom: none;
    }
    .test-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .badge-pass {
      background: rgba(0, 186, 124, 0.15);
      color: #00ba7c;
      border: 1px solid #00ba7c;
    }
    .badge-fail {
      background: rgba(244, 33, 46, 0.15);
      color: #f4212e;
      border: 1px solid #f4212e;
    }
    .test-detail {
      font-family: monospace;
      font-size: 0.8rem;
      color: #71767b;
      margin-left: 60px;
      word-break: break-all;
    }
    .test-error {
      color: #f4212e;
      font-weight: 600;
    }
    /* Hidden sandbox area for DOM test cases */
    #sandbox {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1><span>⚡</span> banmo_tag v1.5.0 자동화 테스트 러너</h1>
      <button id="run-btn" class="btn" onclick="runAllTests()">테스트 다시 실행</button>
    </header>

    <div class="summary-cards">
      <div class="card">
        <div class="card-label">전체 테스트</div>
        <div id="stat-total" class="card-num total">0</div>
      </div>
      <div class="card">
        <div class="card-label">통과 (Pass)</div>
        <div id="stat-passed" class="card-num passed">0</div>
      </div>
      <div class="card">
        <div class="card-label">실패 (Fail)</div>
        <div id="stat-failed" class="card-num failed">0</div>
      </div>
      <div class="card">
        <div class="card-label">소요 시간</div>
        <div id="stat-time" class="card-num time">0ms</div>
      </div>
    </div>

    <div id="results"></div>
  </div>

  <!-- 테스트용 가상 DOM 샌드박스 -->
  <div id="sandbox"></div>

  <script src="../extension/shared.js"></script>
  <script>
    // =========================================================================
    // 초경량 테스트 프레임워크 (Lightweight Test Framework)
    // =========================================================================

    const testSuites = [];
    let currentSuite = null;

    function describe(suiteName, fn) {
      currentSuite = { name: suiteName, tests: [] };
      testSuites.push(currentSuite);
      fn();
    }

    function it(testName, fn) {
      currentSuite.tests.push({ name: testName, fn });
    }

    function assert(condition, message) {
      if (!condition) {
        throw new Error(message || 'Assertion failed');
      }
    }

    function assertEqual(actual, expected, message) {
      if (actual !== expected) {
        throw new Error((message ? message + ': ' : '') + `Expected [${expected}] but got [${actual}]`);
      }
    }

    function assertDeepEqual(actual, expected, message) {
      const actualJson = JSON.stringify(actual);
      const expectedJson = JSON.stringify(expected);
      if (actualJson !== expectedJson) {
        throw new Error((message ? message + ': ' : '') + `Expected ${expectedJson} but got ${actualJson}`);
      }
    }

    // =========================================================================
    // 테스트 케이스 정의
    // =========================================================================

    // SUITE 1: cleanListName 테스트
    describe('1. 리스트 이름 태그 제거 (cleanListName)', () => {
      it('브라우저 타이틀에 붙은 (@내태그) 제거 확인', () => {
        const input = '내 친구들 (@black_tag) / X';
        assertEqual(cleanListName(input), '내 친구들');
      });

      it('구분 기호(·)와 함께 붙은 태그 제거 확인', () => {
        const input = '코인 뉴스 · @developer';
        assertEqual(cleanListName(input), '코인 뉴스');
      });

      it('대시(-)와 함께 붙은 태그 제거 확인', () => {
        const input = 'IT 주요 소식 - @my_handle';
        assertEqual(cleanListName(input), 'IT 주요 소식');
      });

      it('앞쪽에 붙은 태그 및 슬래시(@tag/list) 제거 확인', () => {
        const input = '@author/react-devs / X';
        assertEqual(cleanListName(input), 'react-devs');
      });

      it('by @tag 형태의 제작자 표기 제거 확인', () => {
        const input = '주식 고수들 by @trader_pro';
        assertEqual(cleanListName(input), '주식 고수들');
      });

      it('리스트 ID만 있는 경우 괄호 보존 확인 (ID는 태그가 아님)', () => {
        const input = '리스트 (21045591795666661778)';
        assertEqual(cleanListName(input), '리스트 (21045591795666661778)');
      });

      it('시스템 접두사(리스트 멤버 - ) 제거 및 순수 이름 추출 확인', () => {
        const input = '리스트 멤버 - 글로벌 뉴스 (@media) / Twitter';
        assertEqual(cleanListName(input), '글로벌 뉴스');
      });

      it('단독 시스템 단어 "리스트"는 cleanListName으로도 제거되지 않음 (별도 검증 필요)', () => {
        // cleanListName은 "리스트"를 그대로 반환 (이름 정제 함수)
        // 실제 차단은 getListNameFromPage의 isValidListName에서 수행됨
        assertEqual(cleanListName('리스트'), '리스트');
        assertEqual(cleanListName('Lists'), 'Lists');
      });

      it('브라우저 탭 알림 카운트 (3) 및 작성자 태그가 결합된 리스트명 완벽 정제', () => {
        const input = '(3) @YunjinJo98/10일페 일요일 만날 사람~';
        assertEqual(cleanListName(input), '10일페 일요일 만날 사람~');
      });

      it('대괄호 알림 카운트 [99+] 및 콜론 태그 정제', () => {
        const input = '[99+] @developer: AI 연구 모임 / X';
        assertEqual(cleanListName(input), 'AI 연구 모임');
      });
    });

    // SUITE 1-B: 시스템/네비게이션 단어 차단 테스트
    describe('1-B. 시스템 단어 리스트 이름 차단 (isValidListName)', () => {
      it('"리스트" 단독 단어는 유효한 리스트 이름으로 거부 (시스템 네비게이션 텍스트)', () => {
        assertEqual(isValidListName('리스트'), false);
        assertEqual(isValidListName('Lists'), false);
        assertEqual(isValidListName('목록'), false);
      });

      it('"멤버 관리", "구성원 관리", "Manage members" 등 관리 화면 텍스트는 거부', () => {
        assertEqual(isValidListName('멤버 관리'), false);
        assertEqual(isValidListName('구성원 관리'), false);
        assertEqual(isValidListName('Manage members'), false);
        assertEqual(isValidListName('List members'), false);
        assertEqual(isValidListName('Members'), false);
        assertEqual(isValidListName('구성원'), false);
        assertEqual(isValidListName('멤버'), false);
      });

      it('"리스트"를 포함하되 실제 이름인 경우는 허용', () => {
        assertEqual(isValidListName('리스트 (12345)'), true);
        assertEqual(isValidListName('내 리스트'), true);
        assertEqual(isValidListName('코인 리스트 모음'), true);
      });

      it('기타 시스템 단어(홈, 탐색하기, 알림 등)도 거부', () => {
        assertEqual(isValidListName('홈'), false);
        assertEqual(isValidListName('Home'), false);
        assertEqual(isValidListName('Explore'), false);
        assertEqual(isValidListName('알림'), false);
      });

      it('일반 리스트 이름은 정상 허용', () => {
        assertEqual(isValidListName('코인 뉴스'), true);
        assertEqual(isValidListName('IT 주요 소식'), true);
        assertEqual(isValidListName('AI 연구자'), true);
      });
    });

    // SUITE 2: sanitizeListsObject 테스트
    describe('2. 기존 저장 데이터 자동 마이그레이션 (sanitizeListsObject)', () => {
      it('태그가 붙어있던 기존 리스트 키를 순수한 이름으로 변경 및 마이그레이션', () => {
        const oldLists = {
          '친구들 (@my_id)': { color: '#1d9bf0', mode: 'normal', members: ['@user1', '@user2'] },
          '개발자': { color: '#00ba7c', mode: 'highlight', members: ['@dev1'] }
        };
        const { newLists, modified } = sanitizeListsObject(oldLists);
        assertEqual(modified, true);
        assert(newLists['친구들'] !== undefined, '친구들 키가 생성되어야 함');
        assert(newLists['친구들 (@my_id)'] === undefined, '구버전 키는 삭제되어야 함');
        assertEqual(newLists['친구들'].members.length, 2);
      });

      it('태그 제거 후 키가 중복되는 경우 멤버 목록 자동 병합 및 중복 제거', () => {
        const oldLists = {
          '테크': { color: '#1d9bf0', mode: 'normal', members: ['@apple', '@google'] },
          '테크 (@my_id)': { color: '#1d9bf0', mode: 'normal', members: ['@google', '@meta'] }
        };
        const { newLists, modified } = sanitizeListsObject(oldLists);
        assertEqual(modified, true);
        assertEqual(Object.keys(newLists).length, 1);
        assertEqual(newLists['테크'].members.length, 3); // apple, google, meta
      });

      it('수정할 내역이 없는 순수 데이터는 modified: false 반환', () => {
        const cleanLists = {
          '테크': { color: '#1d9bf0', mode: 'normal', members: ['@apple'] }
        };
        const { modified } = sanitizeListsObject(cleanLists);
        assertEqual(modified, false);
      });

      it('스토리지 내 "멤버 관리" 등 시스템 단어 리스트 자동 삭제', () => {
        const oldLists = {
          '멤버 관리': { color: '#1d9bf0', mode: 'normal', members: ['@u1', '@u2'] },
          '정상 리스트': { color: '#1d9bf0', mode: 'normal', members: ['@u3'] }
        };
        const { newLists, modified } = sanitizeListsObject(oldLists);
        assertEqual(modified, true);
        assertEqual(newLists['멤버 관리'], undefined);
        assert(newLists['정상 리스트'] !== undefined, '정상 리스트는 유지되어야 함');
      });

      it('스토리지 내 (3) @tag/ 리스트 키가 순수 리스트명으로 자동 마이그레이션', () => {
        const oldLists = {
          '(3) @YunjinJo98/10일페 일요일 만날 사람~': { color: '#1d9bf0', mode: 'normal', members: ['@u1', '@u2'] }
        };
        const { newLists, modified } = sanitizeListsObject(oldLists);
        assertEqual(modified, true);
        assertEqual(newLists['(3) @YunjinJo98/10일페 일요일 만날 사람~'], undefined);
        assert(newLists['10일페 일요일 만날 사람~'] !== undefined);
        assertEqual(newLists['10일페 일요일 만날 사람~'].members.length, 2);
      });
    });

    // SUITE 3: isExcludedUserCell 및 모달 창 격리 테스트
    describe('3. 팔로우 추천 차단 및 모달 창 격리 (isExcludedUserCell)', () => {
      const sandbox = document.getElementById('sandbox');

      it('모달 창(dialog) 내부의 정상 멤버 셀은 포함(false) 판정', () => {
        sandbox.innerHTML = `
          <div role="dialog">
            <div data-testid="UserCell" id="cell-inside-dialog">
              <a href="/member_user">@member_user</a>
            </div>
          </div>
        `;
        const dialog = sandbox.querySelector('div[role="dialog"]');
        const cell = sandbox.querySelector('#cell-inside-dialog');
        assertEqual(isExcludedUserCell(cell, dialog), false);
      });

      it('모달 창이 열렸을 때, 창 뒤쪽 배경의 유저 셀은 100% 차단(true) 판정', () => {
        sandbox.innerHTML = `
          <div id="background-page">
            <div data-testid="UserCell" id="cell-behind-dialog">
              <a href="/recommended_user">@recommended_user</a>
            </div>
          </div>
          <div role="dialog">
            <h2>멤버 목록</h2>
          </div>
        `;
        const dialog = sandbox.querySelector('div[role="dialog"]');
        const cell = sandbox.querySelector('#cell-behind-dialog');
        assertEqual(isExcludedUserCell(cell, dialog), true);
      });

      it('사이드바(sidebarColumn, aside) 내부의 팔로우 추천 셀 차단 판정', () => {
        sandbox.innerHTML = `
          <div data-testid="sidebarColumn">
            <aside>
              <div data-testid="UserCell" id="cell-in-sidebar">
                <a href="/sidebar_reco">@sidebar_reco</a>
              </div>
            </aside>
          </div>
        `;
        const cell = sandbox.querySelector('#cell-in-sidebar');
        assertEqual(isExcludedUserCell(cell, null), true);
      });

      it('aria-label="팔로우 추천" 컨테이너 내부 셀 차단 판정', () => {
        sandbox.innerHTML = `
          <div aria-label="팔로우 추천">
            <div data-testid="UserCell" id="cell-reco-label">
              <a href="/who_to_follow">@who_to_follow</a>
            </div>
          </div>
        `;
        const cell = sandbox.querySelector('#cell-reco-label');
        assertEqual(isExcludedUserCell(cell, null), true);
      });

      it('모달 내부라도 "추천" 탭 활성화 시 셀 차단 판정', () => {
        sandbox.innerHTML = `
          <div role="dialog">
            <div role="tab" aria-selected="true">추천</div>
            <div data-testid="UserCell" id="cell-reco-tab">
              <a href="/suggested_user">@suggested_user</a>
            </div>
          </div>
        `;
        const dialog = sandbox.querySelector('div[role="dialog"]');
        const cell = sandbox.querySelector('#cell-reco-tab');
        assertEqual(isExcludedUserCell(cell, dialog), true);
      });
    });

    // SUITE 4: extractMembersFromContainer 테스트
    describe('4. 순수 멤버 유저 추출 (extractMembersFromContainer)', () => {
      const sandbox = document.getElementById('sandbox');

      it('멤버 모달 창 내부의 실제 멤버들만 정확히 추출 (배경 추천 계정 배제)', () => {
        sandbox.innerHTML = `
          <div id="background-page">
            <div data-testid="UserCell"><a href="/fake_reco_user">@fake_reco_user</a></div>
          </div>
          <div role="dialog" id="active-dialog">
            <div role="tab" aria-selected="true">구성원</div>
            <div data-testid="UserCell"><a href="/real_member1">@real_member1</a></div>
            <div data-testid="UserCell"><a href="/real_member2">@real_member2</a></div>
          </div>
        `;
        const dialog = sandbox.querySelector('#active-dialog');
        const members = extractMembersFromContainer(dialog, dialog);
        assertDeepEqual(members, ['@real_member1', '@real_member2']);
      });

      it('시스템 예약어 링크(home, explore 등)는 멤버에서 제외', () => {
        sandbox.innerHTML = `
          <div data-testid="primaryColumn" id="members-page">
            <div data-testid="UserCell"><a href="/home">Home</a></div>
            <div data-testid="UserCell"><a href="/valid_user">@valid_user</a></div>
          </div>
        `;
        const container = sandbox.querySelector('#members-page');
        const members = extractMembersFromContainer(container, null);
        assertDeepEqual(members, ['@valid_user']);
      });
    });

    // SUITE 5: buildHandleMap 및 타임라인 뱃지 매핑 테스트
    describe('5. 타임라인 뱃지 매핑 (buildHandleMap)', () => {
      it('대소문자 무관(Case-insensitive) 핸들 검색 매핑 생성', () => {
        const lists = {
          'AI 연구자': { color: '#7928ca', mode: 'highlight', members: ['@YannLeCun', '@sama'] }
        };
        const map = buildHandleMap(lists);
        assert(map['@yannlecun'] !== undefined, '소문자 키로 조회 가능해야 함');
        assertEqual(map['@yannlecun'][0].name, 'AI 연구자');
        assertEqual(map['@yannlecun'][0].mode, 'highlight');
        assertEqual(map['@sama'][0].color, '#7928ca');
      });

      it('여러 리스트에 중복 소속된 유저의 다중 뱃지 매핑 확인', () => {
        const lists = {
          '테크': { color: '#1d9bf0', mode: 'normal', members: ['@elonmusk'] },
          '우주': { color: '#f4212e', mode: 'highlight', members: ['@elonmusk'] }
        };
        const map = buildHandleMap(lists);
        assertEqual(map['@elonmusk'].length, 2);
        assertEqual(map['@elonmusk'][0].name, '테크');
        assertEqual(map['@elonmusk'][1].name, '우주');
      });
    });

    // SUITE 6: 개별 멤버 삭제 로직 테스트 (shared.js removeMemberFromLists)
    describe('6. 개별 멤버 삭제 (removeMemberFromLists 검증)', () => {
      it('특정 핸들만 대소문자 무관하게 리스트에서 정확하게 제거하고 변경 여부를 반환', () => {
        const listData = {
          '개발자': { color: '#1d9bf0', mode: 'normal', members: ['@user1', '@User2', '@user3'] }
        };
        const changed = removeMemberFromLists(listData, '개발자', '@user2');
        assertEqual(changed, true);
        assertDeepEqual(listData['개발자'].members, ['@user1', '@user3']);

        const unchanged = removeMemberFromLists(listData, '개발자', '@nonexistent');
        assertEqual(unchanged, false);
      });
    });

    // SUITE 7: URL 파싱 및 자동/수동 수집 차단 정책 (parseListUrl & getScrapeBlockReason)
    describe('7. 리스트 URL 파싱 및 수집 차단 정책 (parseListUrl & getScrapeBlockReason)', () => {
      const sandbox = document.getElementById('sandbox');

      it('/i/lists/:id 및 /members, /followers URL 정확히 판별', () => {

    // =========================================================================
    // 테스트 실행기 엔진
    // =========================================================================

    function runAllTests() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';
      
      let totalCount = 0;
      let passCount = 0;
      let failCount = 0;

      const startTime = performance.now();

      testSuites.forEach(suite => {
        const suiteEl = document.createElement('div');
        suiteEl.className = 'test-suite';

        const headerEl = document.createElement('div');
        headerEl.className = 'suite-header';
        headerEl.textContent = suite.name;
        suiteEl.appendChild(headerEl);

        let suitePass = 0;
        let suiteFail = 0;

        suite.tests.forEach(test => {
          totalCount++;
          const testEl = document.createElement('div');
          testEl.className = 'test-item';

          const titleRow = document.createElement('div');
          titleRow.className = 'test-title-row';

          const badge = document.createElement('span');
          badge.className = 'badge';

          const title = document.createElement('span');
          title.textContent = test.name;

          titleRow.appendChild(badge);
          titleRow.appendChild(title);
          testEl.appendChild(titleRow);

          let capturedError = null;
          try {
            test.fn();
            passCount++;
            suitePass++;
            badge.className += ' badge-pass';
            badge.textContent = 'PASS';
          } catch (err) {
            failCount++;
            suiteFail++;
            badge.className += ' badge-fail';
            badge.textContent = 'FAIL';
            capturedError = err.message;

            const errDetail = document.createElement('div');
            errDetail.className = 'test-detail test-error';
            errDetail.textContent = '❌ ' + err.message;
            testEl.appendChild(errDetail);
          }
          test._passed = (badge.textContent === 'PASS');
          test._error = test._passed ? null : capturedError;

          suiteEl.appendChild(testEl);
        });

        resultsDiv.appendChild(suiteEl);
      });

      const endTime = performance.now();
      const elapsed = Math.round(endTime - startTime);

      document.getElementById('stat-total').textContent = totalCount;
      document.getElementById('stat-passed').textContent = passCount;
      document.getElementById('stat-failed').textContent = failCount;
      document.getElementById('stat-time').textContent = elapsed + 'ms';

      // CLI 자동화 러너를 위한 정형화된 JSON 데이터 출력
      const report = {
        total: totalCount,
        passed: passCount,
        failed: failCount,
        duration: elapsed + 'ms',
        suites: testSuites.map(suite => ({
          name: suite.name,
          tests: suite.tests.map(t => ({
            name: t.name,
            passed: t._passed,
            error: t._error || null
          }))
        }))
      };

      let jsonEl = document.getElementById('test-results-data');
      if (!jsonEl) {
        jsonEl = document.createElement('script');
        jsonEl.id = 'test-results-data';
        jsonEl.type = 'application/json';
        document.body.appendChild(jsonEl);
      }
      jsonEl.textContent = JSON.stringify(report);
    }

    // 페이지 로드 시 자동 실행
    window.addEventListener('DOMContentLoaded', () => {
      runAllTests();
    });
  </script>
