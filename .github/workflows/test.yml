name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version consistency (manifest.json vs CHANGELOG.md)
        shell: pwsh
        run: |
          $manifest = Get-Content extension/manifest.json -Raw | ConvertFrom-Json
          $changelog = Get-Content docs/CHANGELOG.md -Raw
          $m = [regex]::Match($changelog, '## \[v([0-9]+\.[0-9]+\.[0-9]+)\]')
          if (-not $m.Success -or $m.Groups[1].Value -ne $manifest.version) {
            Write-Error "Version mismatch: manifest.json=$($manifest.version), CHANGELOG.md=$($m.Groups[1].Value)"
            exit 1
          }
          Write-Host "Version v$($manifest.version) OK"

      - name: Run unit tests (headless Chrome)
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tests/run-tests.ps1
