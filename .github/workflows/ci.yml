name: CI/CD

# main 에 push 할 때마다: 정적 검사·ESLint / E2E(실제 확장 프로그램) / Windows 테스트+zip 빌드
#   → 모두 통과하고 새 버전이면 GitHub Release 생성
# PR(Dependabot 포함)에서는 검사·테스트·빌드까지만 실행합니다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR 은 새 커밋이 오면 이전 실행을 취소, main 은 순서대로 모두 실행
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: 정적 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 개발 도구 설치
        run: npm ci

      - name: manifest / 파일 참조 / JS 문법 / CSP / 문서 링크 검사
        run: node scripts/validate.js

      - name: ESLint (정의되지 않은 함수·변수 등)
        run: npx eslint .

  e2e:
    name: E2E 테스트 (실제 확장 프로그램)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 개발 도구 설치
        run: npm ci

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      # 확장 프로그램을 Chromium 에 로드하고, x.com 요청에는 tests/fixtures 의 HTML 로 응답
      - name: E2E + shared.js 단위 테스트
        run: npx playwright test

      - name: 실패 시 보고서 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  build:
    name: 테스트 및 빌드
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # build.ps1: 버전 일치 확인 → 자동 테스트(headless Chrome) → dist/banmo_tag-v<버전>.zip
      - name: 테스트 + 패키징
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1

      - name: 버전 확인
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT
          "### 빌드 결과`n`n- 버전: v$v`n- 파일: banmo_tag-v$v.zip" >> $env:GITHUB_STEP_SUMMARY

      - name: 배포 zip 업로드
        uses: actions/upload-artifact@v7
        with:
          name: banmo_tag-v${{ steps.version.outputs.version }}
          path: dist/banmo_tag-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    name: GitHub Release (새 버전일 때만)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, e2e, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 빌드된 zip 받기
        uses: actions/download-artifact@v8
        with:
          name: banmo_tag-v${{ needs.build.outputs.version }}
          path: dist

      # 릴리스를 건너뛰는 실행에서도 artifact 전달이 정상인지 매번 확인
      - name: zip 확인
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          zip="dist/banmo_tag-v$VERSION.zip"
          test -f "$zip" || { echo "::error::$zip 이 없습니다"; ls -R dist; exit 1; }
          unzip -l "$zip"
          unzip -l "$zip" | grep -q ' manifest.json$' || { echo "::error::zip 안에 manifest.json 이 없습니다"; exit 1; }

      - name: 릴리스 생성
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "릴리스 $tag 이(가) 이미 있어 건너뜁니다. (새 릴리스를 만들려면 manifest.json 과 CHANGELOG.md 의 버전을 올리세요)"
            echo "- 릴리스 $tag 이미 있음 → 건너뜀" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # CHANGELOG.md 에서 해당 버전 섹션만 잘라 릴리스 노트로 사용
          awk -v head="## [$tag]" 'index($0, head) == 1 { found = 1; next } found && /^## \[/ { exit } found { print }' docs/CHANGELOG.md > notes.md
          gh release create "$tag" "dist/banmo_tag-$tag.zip" \
            --title "banmo_tag $tag" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
          echo "- 릴리스 $tag 생성 완료" >> "$GITHUB_STEP_SUMMARY"
