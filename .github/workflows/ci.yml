name: CI

# main 에 push 할 때마다, 그리고 PR(Dependabot 포함)마다:
#   정적 검사·ESLint·파이어폭스 호환성(web-ext lint) / E2E(크롬 계열 Chromium) /
#   실제 Firefox 동작 확인 / Windows 단위 테스트 + zip 패키징 확인
# 릴리스는 GitHub 에서 직접(수동으로) 만듭니다. 이 워크플로는 Release 나 배포 파일을 만들지 않으며,
# 저장소 쓰기 권한도 없습니다(permissions: contents: read).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # PR 은 새 커밋이 오면 이전 실행을 취소, main 은 순서대로 모두 실행
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: 정적 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 개발 도구 설치
        run: npm ci

      - name: manifest / 파일 참조 / JS 문법 / CSP / 문서 링크 검사
        run: node scripts/validate.js

      - name: ESLint (정의되지 않은 함수·변수 등)
        run: npx eslint .

      # Mozilla 부가 기능 사이트(AMO) 제출 때와 같은 검사. 오류가 있으면 실패 (경고는 통과)
      - name: 파이어폭스 호환성 검사 (web-ext lint)
        run: npx web-ext lint --source-dir extension --no-input

  e2e:
    name: E2E 테스트 (실제 확장 프로그램)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 개발 도구 설치
        run: npm ci

      - name: Playwright Chromium 설치
        run: npx playwright install --with-deps chromium

      # 확장 프로그램을 Chromium 에 로드하고, x.com 요청에는 tests/fixtures 의 HTML 로 응답
      - name: E2E + shared.js 단위 테스트
        run: npx playwright test

      - name: 실패 시 보고서 업로드
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  firefox:
    name: 파이어폭스 동작 확인 (실제 Firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 개발 도구 설치
        run: npm ci

      - name: Firefox 받기 (최신 안정판)
        id: firefox
        run: |
          line=$(npx @puppeteer/browsers install firefox@stable --path "$RUNNER_TEMP/browsers" | tail -n 1)
          echo "$line"
          echo "bin=${line#* }" >> "$GITHUB_OUTPUT"

      # 테스트 서버가 x.com 처럼 포트 없는 주소(포트 80)로 응답하도록
      - name: 포트 80 사용 허용
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80

      - name: 실제 Firefox 에 임시 설치해 주요 기능 확인
        env:
          FIREFOX_BIN: ${{ steps.firefox.outputs.bin }}
        run: npm run test:firefox

  build:
    name: 테스트 및 패키징 확인
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # build.ps1: 버전 일치 확인 → 정적 검사 → 단위 테스트(headless Chrome) → zip 만들기
      - name: 테스트 + 패키징
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/build.ps1

      # 만든 zip 은 확인만 하고 업로드하지 않음 (배포 파일은 릴리스할 때 직접 만들어 올림)
      - name: zip 내용 확인
        shell: pwsh
        run: |
          $v = (Get-Content extension/manifest.json -Raw | ConvertFrom-Json).version
          $zip = "dist/banmo_tag-v$v.zip"
          if (-not (Test-Path $zip)) { Write-Error "$zip 이 없습니다"; exit 1 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip))
          $entries = $archive.Entries.FullName
          $archive.Dispose()
          $entries | ForEach-Object { Write-Host "  $_" }
          $required = 'manifest.json', 'shared.js', 'content.js', 'background.js', 'popup.html', 'popup.js', 'styles.css',
            'icons/icon16.png', 'icons/icon32.png', 'icons/icon48.png', 'icons/icon128.png'
          $missing = $required | Where-Object { $entries -notcontains $_ }
          if ($missing) { Write-Error "zip 에 없는 파일: $($missing -join ', ')"; exit 1 }
          # zip 표준은 경로 구분자로 / 를 씀 (\ 가 있으면 폴더로 인식되지 않을 수 있음)
          $backslash = $entries | Where-Object { $_ -like '*\*' }
          if ($backslash) { Write-Error "zip 경로에 \ 가 있습니다: $($backslash -join ', ')"; exit 1 }
          "### 패키징 확인`n`n- 버전: v$v (zip 은 업로드하지 않음)`n- 파일 $($entries.Count)개, 필수 파일 모두 포함" >> $env:GITHUB_STEP_SUMMARY
